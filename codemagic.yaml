workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build Android Debug APK
        script: flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk