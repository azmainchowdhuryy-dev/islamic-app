name: islamic_app
description: Islamic educational app for Sadaqah Jariyah.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  adhan: ^2.0.0+1
  share_plus: ^12.0.2
  hijri_date_time: ^1.1.0
  bangla_utilities: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
