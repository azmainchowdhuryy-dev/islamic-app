name: Flutter CI

concurrency:
  group: flutter-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/home-dashboard
      - fix/launcher-icon-and-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APKs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Release APK build attempt ${attempt}/3"
            if flutter build apk --release --split-per-abi; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Release APK build failed after 3 attempts."
          exit 1

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: islamic-app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
